version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# Neo4j 5.x for IAM Permission Graph (Phase 3)
#
# Start:  docker compose up -d
# Stop:   docker compose down
# Reset:  docker compose down -v   (wipes graph data — use before re-ingesting)
# Browser: http://localhost:7474   (username: neo4j, password: killswitch-local-dev)
# Bolt:    bolt://localhost:7687
# ─────────────────────────────────────────────────────────────────────────────

services:
  neo4j:
    image: neo4j:5.18-community
    container_name: killswitch-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"   # HTTP browser
      - "7687:7687"   # Bolt protocol (Python driver)
    environment:
      NEO4J_AUTH: "neo4j/killswitch-local-dev"
      NEO4J_PLUGINS: '["apoc"]'                  # APOC for advanced graph algorithms
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
      NEO4J_dbms_memory_heap_initial__size: "512m"
      NEO4J_dbms_memory_heap_max__size: "1G"
      NEO4J_server_logs_debug_enabled: "false"   # Reduce noise
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_plugins:/plugins
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:7474"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local
  neo4j_plugins:
    driver: local
